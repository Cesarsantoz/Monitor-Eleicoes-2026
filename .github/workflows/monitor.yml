name: Monitor TSE - cada 10 minutos

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-tse
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar TSE
        run: python monitor.py

      - name: Salvar dados
        run: |
          if ! git diff --quiet -- dados/ || [ -n "$(git ls-files --others --exclude-standard dados/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dados/
            git commit -m 'Atualiza apuracao TSE [skip ci]'
            git push
          fi
