name: Publicar painel eleitoral

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Monitor TSE - cada 10 minutos']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - name: Preparar painel
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d dados ]; then
            cp -r dados _site/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
